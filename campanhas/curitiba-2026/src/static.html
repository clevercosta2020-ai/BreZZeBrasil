<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>BreZZe Curitiba — Estático</title>
<link rel="stylesheet" href="common.css">
<style>
#stage .photo{position:absolute;object-fit:cover}
.shade{position:absolute;inset:0}
.wv{position:absolute;opacity:.55}
.wv svg{width:100%;height:100%}
.cwbwrap{position:absolute;opacity:.22}
.cwbwrap svg{width:100%;height:100%}
.brand{position:absolute;display:flex;align-items:center;justify-content:space-between}
.brand img{height:100%}
h1{font-weight:900;line-height:1.02;letter-spacing:-.025em}
.lead{font-weight:500;line-height:1.38;opacity:.9}
.lead b{font-weight:800;color:var(--cyan)}
.stats{position:absolute;display:flex}
.stat b{white-space:nowrap}
.stat{flex:1;padding-left:calc(var(--u)*1.8);border-left:calc(var(--u)*.45) solid var(--cyan)}
.strip{position:absolute;left:0;right:0;bottom:0;background:rgba(3,20,38,.82);border-top:1px solid rgba(60,203,244,.35);display:flex;align-items:center}
.strip .lbl{font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
.strip .logos{flex:1}
.tag{font-weight:800;font-style:italic}
.ctawrap{position:absolute}
.ctawrap .sub{font-weight:700;margin-top:calc(var(--u)*1.4);opacity:.9}
.qrbox{position:absolute}
.qrtitle{font-weight:900;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.qrlist{list-style:none;font-weight:600}
.qrlist li{display:flex;align-items:center;gap:.5em}
.qrlist li:before{content:'';width:.5em;height:.5em;border-radius:50%;background:var(--cyan);flex:none}
</style></head><body>
<div id="stage"></div>
<script src="shared.js"></script>
<script>
const u = Math.min(W, H) / 100;
const px = v => v + 'px';
let html = '';
const add = s => html += s;

if (F === '16x9') {
  add(`<img class="photo" src="img/ph_woman_kiosk.jpg" style="left:${W*.36}px;top:0;width:${W*.64}px;height:${H}px;object-position:50% 30%">`);
  add(`<div class="shade" style="background:linear-gradient(90deg,#06223D 0%,#06223D 38%,rgba(6,34,61,.82) 48%,rgba(6,34,61,.35) 64%,rgba(6,34,61,.12) 85%),linear-gradient(0deg,rgba(6,34,61,.97) 0%,rgba(6,34,61,.6) 25%,rgba(6,34,61,0) 48%)"></div>`);
  add(`<div class="wv" style="left:-100px;top:${H*.52}px;width:${W*.75}px;height:${H*.35}px">${waves(30,1600,400,70,.4)}</div>`);
  add(`<div class="cwbwrap" style="left:${u*62}px;top:${u*3}px;width:${u*16}px;height:${u*16}px">${CWB}</div>`);
  add(`<div class="brand" style="left:${u*7}px;top:${u*6.5}px;height:${u*7.5}px;gap:${u*3}px"><img src="img/brezze_logo.png"></div>`);
  add(`<div class="abs" style="left:${u*7}px;top:${u*17}px"><span class="pill">${ICON.pin} Chegamos a Curitiba</span></div>`);
  add(`<h1 class="abs" style="left:${u*7}px;top:${u*25}px;width:${u*80}px;font-size:${u*7.4}px">Sua marca nas mãos<br>de Curitiba.<br><span class="accent">24 horas por dia.</span></h1>`);
  add(`<div class="stats" style="left:${u*7}px;top:${u*51}px;width:${u*84}px;gap:${u*3}px">
    <div class="stat"><b style="font-size:${u*5.6}px">+50 mil</b><span style="font-size:${u*1.9}px">locações realizadas</span></div>
    <div class="stat"><b style="font-size:${u*5.6}px">+19 mil</b><span style="font-size:${u*1.9}px">usuários cadastrados</span></div>
    <div class="stat"><b style="font-size:${u*5.6}px">24h</b><span style="font-size:${u*1.9}px">sua marca em movimento</span></div></div>`);
  add(`<div class="abs" style="left:0;right:0;bottom:${u*13.5}px;display:flex;justify-content:center"><div style="text-align:center;padding:${u*2}px ${u*3.5}px;border-radius:${u*2.5}px;background:rgba(6,34,61,.78);backdrop-filter:blur(8px);border:1px solid rgba(60,203,244,.4)">
     <div style="font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-size:${u*2}px">Oportunidade!</div>
     <div style="font-weight:900;font-size:${u*4.4}px;line-height:1.05;margin-top:${u*.8}px;white-space:nowrap">Invista no OOH Smart</div>
     <div style="font-weight:600;font-size:${u*2.3}px;margin-top:${u*1}px">Invista no TeamWork BreZZe Brasil.</div><div class="tag" style="font-size:${u*2.2}px;margin-top:${u*1.2}px">Leve a energia com você!</div></div></div>`);
  add(qrCorners(u*14, u*7, u*12.8));
  add(`<div class="strip" style="height:${u*11}px;padding:0 ${u*7}px;gap:${u*4}px"><div class="lbl" style="font-size:${u*1.5}px">Marcas que também<br>se conectaram</div><div class="logos">${logosHTML(u*3.1)}</div></div>`);
}

if (F === '9x16') {
  add(`<img class="photo" src="img/ph_woman_kiosk.jpg" style="left:0;top:0;width:${W}px;height:${H*.5}px;object-position:50% 22%">`);
  add(`<div class="shade" style="background:linear-gradient(180deg,rgba(6,34,61,.75) 0%,rgba(6,34,61,0) 14%,rgba(6,34,61,.1) 26%,#06223D 46%)"></div>`);
  add(`<div class="wv" style="left:-80px;top:${H*.42}px;width:${W+160}px;height:${H*.2}px">${waves(30,1600,400,80,1.1)}</div>`);
  add(`<div class="brand" style="left:${u*7}px;right:${u*7}px;top:${u*10}px;height:${u*7}px"><img src="img/brezze_logo.png"></div>`);
  add(`<div class="abs" style="left:${u*7}px;top:${H*.355}px"><span class="pill" style="font-size:${u*2.8}px">${ICON.pin} Chegamos a Curitiba</span></div>`);
  add(`<h1 class="abs" style="left:${u*7}px;top:${H*.398}px;width:${u*88}px;font-size:${u*9.6}px">Sua marca nas mãos de Curitiba.<br><span class="accent">24h por dia.</span></h1>`);
  add(`<p class="lead abs" style="left:${u*7}px;top:${H*.573}px;width:${u*86}px;font-size:${u*3.4}px">Powerbanks compartilhados que viram <b>mídia OOH</b> — com <b>QR Code estratégico</b> para sua mensagem, seu lead form e sua experiência.</p>`);
  add(`<div class="stats" style="left:${u*7}px;top:${H*.663}px;width:${u*86}px;gap:${u*3}px">
    <div class="stat"><b style="font-size:${u*8}px">+50 mil</b><span style="font-size:${u*2.6}px">locações</span></div>
    <div class="stat"><b style="font-size:${u*8}px">+19 mil</b><span style="font-size:${u*2.7}px">usuários cadastrados</span></div></div>`);
  add(qrCorners(u*14.5, u*6, u*4));
  add(`<div class="abs" style="left:${u*28}px;right:${u*23}px;bottom:${u*6}px;text-align:center">
     <div style="font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-size:${u*2.4}px">Oportunidade!</div>
     <div style="font-weight:900;font-size:${u*4.4}px;line-height:1.05;margin-top:${u*.8}px;">Invista no OOH Smart</div>
     <div style="font-weight:600;font-size:${u*2.5}px;margin-top:${u*1}px">Invista no TeamWork BreZZe Brasil.</div><div class="tag" style="font-size:${u*2.6}px;margin-top:${u*1.4}px">Leve a energia com você!</div></div>`);
  add(`<div class="abs" style="left:${u*5}px;right:${u*5}px;top:${H*.748}px;border-top:1px solid rgba(60,203,244,.3);border-bottom:1px solid rgba(60,203,244,.3);padding:${u*1.4}px 0">
     <div style="text-align:center;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-size:${u*1.8}px;margin-bottom:${u*1.2}px">Marcas que também se conectaram</div>
     <div class="logos" style="flex-wrap:wrap;justify-content:center;gap:${u*1.6}px ${u*2.6}px">${logosHTML(u*3)}</div></div>`);
}

if (F === '1x1' || F === '4x5') {
  const hh = H;
  add(`<img class="photo" src="img/ph_woman_kiosk.jpg" style="left:${W*.3}px;top:0;width:${W*.7}px;height:${hh}px;object-position:45% 30%">`);
  add(`<div class="shade" style="background:linear-gradient(90deg,#06223D 0%,#06223D 32%,rgba(6,34,61,.8) 44%,rgba(6,34,61,.3) 64%,rgba(6,34,61,.1) 85%),linear-gradient(0deg,rgba(6,34,61,.97) 0%,rgba(6,34,61,.7) 24%,rgba(6,34,61,0) 45%)"></div>`);
  add(`<div class="wv" style="left:-60px;top:${hh*.5}px;width:${W*.9}px;height:${hh*.3}px">${waves(28,1600,400,70,.4)}</div>`);
  add(`<div class="brand" style="left:${u*6}px;top:${u*6}px;height:${u*7}px"><img src="img/brezze_logo.png"></div>`);
  add(`<div class="abs" style="left:${u*6}px;top:${u*17}px"><span class="pill">${ICON.pin} Chegamos a Curitiba</span></div>`);
  add(`<h1 class="abs" style="left:${u*6}px;top:${u*25}px;width:${u*80}px;font-size:${u*7.2}px">Sua marca nas<br>mãos de Curitiba.<br><span class="accent">24h por dia.</span></h1>`);
  add(`<div class="stats" style="left:${u*6}px;top:${u*(F==="4x5"?62:50)}px;width:${u*56}px;gap:${u*2.5}px">
    <div class="stat"><b style="font-size:${u*6}px">+50 mil</b><span style="font-size:${u*2}px">locações</span></div>
    <div class="stat"><b style="font-size:${u*6}px">+19 mil</b><span style="font-size:${u*2}px">usuários</span></div></div>`);
  add(qrCorners(u*13, u*5, u*13.5));
  add(`<div class="abs" style="left:${u*23}px;right:${u*19}px;bottom:${u*14}px;text-align:center">
     <div style="font-weight:900;letter-spacing:.2em;color:var(--cyan);font-size:${u*1.9}px">OPORTUNIDADE!</div>
     <div class="btn" style="font-size:${u*2.5}px;margin-top:${u*1.2}px">Invista no OOH Smart ${ICON.arrow}</div>
     <div style="font-weight:600;font-size:${u*2}px;margin-top:${u*1.4}px">Invista no TeamWork BreZZe Brasil.</div></div>`);
  add(`<div class="strip" style="height:${u*11.5}px;padding:0 ${u*5}px;flex-direction:column;justify-content:center;gap:${u*1.2}px">
     <div class="logos" style="width:100%;gap:${u*.8}px">${logosHTML(u*2.5)}</div></div>`);
}
stage.innerHTML = html;
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))]);
</script></body></html>
