<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>BreZZe Curitiba — Vídeo</title>
<link rel="stylesheet" href="common.css">
<style>
.hscr{position:absolute;inset:0;opacity:0}
.nodash path,.nodash circle{stroke-dasharray:none!important;stroke-dashoffset:0!important;stroke:#d9f6ff}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0}
.scene .bgimg{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;transform-origin:50% 40%}
.shade{position:absolute;inset:0}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.a{will-change:transform,opacity}
.big{font-weight:900;line-height:1.03;letter-spacing:-.025em}
.kicker{font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.line{display:block;white-space:nowrap}
.wv{position:absolute;opacity:.6}
.wv svg{width:100%;height:100%}
.cwb path,.cwb circle{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.chip{display:inline-flex;align-items:center;gap:.6em;background:rgba(255,255,255,.1);border:1px solid rgba(60,203,244,.55);
  border-radius:999px;padding:.55em 1.1em;font-weight:700;backdrop-filter:blur(6px)}
.chip i{width:.55em;height:.55em;border-radius:50%;background:var(--cyan);display:inline-block}
.statbig b{display:block;font-weight:900;line-height:1;letter-spacing:-.03em}
.statbig b span{display:inline!important;margin:0!important;opacity:1!important}
.statbig > span{display:block;font-weight:600;opacity:.9;margin-top:.3em}
.bar{position:absolute;left:0;bottom:0;height:calc(var(--u)*.8);background:linear-gradient(90deg,#3CCBF4,#C6FF2E);box-shadow:0 0 calc(var(--u)*1.5) rgba(198,255,46,.6)}
.logogrid{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.logogrid .slot{display:flex;justify-content:center;align-items:center}
.logogrid img{filter:brightness(0) invert(1);object-fit:contain}
.logogrid .wm{font-weight:900;letter-spacing:-.02em;line-height:1}
.scan{position:absolute;left:6%;right:6%;height:3px;background:var(--cyan);box-shadow:0 0 18px 4px rgba(60,203,244,.8)}
</style></head><body>
<div id="stage"></div>
<script src="shared.js"></script>
<script>
const u = Math.min(W, H) / 100;
const V = F === '9x16', L = F === '16x9';
const s = (a, b, c) => V ? a : (L ? c : b);           // pick by format: (vertical, square, landscape)
const T = 30;                                          // duration (s)
const OFF = 4.0, K = 22.5 / 28, D = 3.5;               // hook lasts OFF s; original 28 s timeline compressed by K; D = 'Como funciona' scene inserted before scene 4
let h = '';


// ---------- HOOK (0–4.25): real people, phone dying ----------
const HPH = [['img/ph_metro_mulher.jpg', s('30% 50%','34% 50%','50% 40%')], ['img/ph_woman_airport.jpg', s('44% 40%','44% 40%','50% 35%')], ['img/ph_man_paulista.jpg', s('32% 45%','36% 45%','50% 40%')]];
const notifBox = V ? `left:${u*5}px;right:${u*5}px;top:${u*7}px` : (L ? `right:${u*5}px;top:${u*5}px;width:${u*62}px` : `left:${u*6}px;right:${u*6}px;top:${u*5}px`);
const hcapBox = L ? `left:${u*8}px;bottom:${u*9}px;width:${u*100}px` : `left:${u*6}px;right:${u*6}px;bottom:${u*s(16,9,0)}px`;
const notif = (title, msg) => `<div class="hnot" style="position:absolute;${notifBox};display:flex;gap:${u*2}px;align-items:center;background:rgba(246,246,248,.92);backdrop-filter:blur(12px);border-radius:${u*s(3.4,2.6,2.4)}px;padding:${u*s(2.6,2,1.8)}px ${u*s(3,2.4,2.2)}px;box-shadow:0 ${u}px ${u*4}px rgba(0,0,0,.45);color:#111;transform:translateY(-160%)">
   <div style="flex:none;width:${u*s(9,7,6.4)}px;height:${u*s(9,7,6.4)}px;border-radius:${u*s(2.2,1.7,1.5)}px;background:#FF3B30;display:flex;align-items:center;justify-content:center">
     <svg viewBox="0 0 26 12" style="width:70%"><rect x="1" y="1" width="21" height="10" rx="2.5" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#fff"/><rect x="2.6" y="2.6" width="1.8" height="6.8" rx=".8" fill="#fff"/></svg></div>
   <div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:${u*s(2.4,1.9,1.7)}px;color:#666;letter-spacing:.04em"><span>BATERIA</span><span>agora</span></div>
     <div style="font-weight:800;font-size:${u*s(3.6,2.9,2.6)}px;margin-top:${u*.3}px">${title}</div>
     <div style="font-weight:500;font-size:${u*s(3,2.4,2.2)}px;color:#333;margin-top:${u*.2}px">${msg}</div></div></div>`;
const hcap = (kick, txt) => `<div class="hcap" style="position:absolute;${hcapBox};opacity:0">
   <div style="display:inline-flex;align-items:center;gap:${u*1.2}px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:#FF3B30;border-radius:999px;padding:${u*.8}px ${u*2}px;font-size:${u*s(2.6,2.1,2)}px">${kick}</div>
   <div class="big" style="font-size:${u*s(8.4,7,6.6)}px;margin-top:${u*1.6}px;text-shadow:0 ${u*.4}px ${u*2}px rgba(0,0,0,.6)">${txt}</div></div>`;
h += `<div class="scene" id="hook" data-s="0" data-e="4.25" style="background:#000">
  <div id="hphotos" style="position:absolute;inset:0;transform-origin:50% 50%">
    ${HPH.map(([src, pos]) => `<img class="hph" src="${src}" style="position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;object-position:${pos};opacity:0">`).join('')}
    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 50%,rgba(0,0,0,.75) 100%)"></div>
  </div>
  <div id="hred" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,0,0,0) 40%,rgba(255,25,25,.85) 100%)"></div>
  <div id="hflash" style="position:absolute;inset:0;background:#ff2a2a;mix-blend-mode:overlay;opacity:0"></div>
  ${hcap('2% de bateria', 'A caminho de um compromisso…')}${hcap('1% de bateria', 'Na hora do embarque…')}${hcap('1% de bateria', 'No meio da chamada…')}
  ${notif('Bateria fraca', '2% restante. Conecte um carregador.')}${notif('Bateria em 1%', 'O celular vai desligar em instantes.')}${notif('Bateria em 1%', 'A chamada será encerrada.')}
  <div id="hline" style="position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:#fff;box-shadow:0 0 18px 6px #fff;opacity:0"></div>
  <div id="hend" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0">
    <svg viewBox="0 0 60 122" style="width:${u*s(18,14,12)}px" fill="none"><rect x="19" y="2" width="22" height="9" rx="3.5" fill="#FF3B30"/><rect x="2" y="14" width="56" height="106" rx="11" stroke="#FF3B30" stroke-width="4"/><rect x="8" y="108" width="44" height="6" rx="3" fill="#FF3B30"/></svg>
    <div class="big" style="font-size:${u*s(10,8,7.4)}px;margin-top:${u*3}px">E agora?!</div></div>
</div>`;

// ---------- SCENE 1 (0–4.4): hook question ----------
h += `<div class="scene" data-s="0" data-e="4.4">
  <img class="bgimg kb" src="img/ph_linha_turismo.jpg" style="object-position:${s('42% 50%','45% 50%','50% 50%')}">
  <div class="shade" style="background:linear-gradient(${s('180deg','180deg','90deg')},rgba(6,34,61,.55),rgba(6,34,61,.92))"></div>
  <div class="center" style="padding:0 ${u*8}px;${L?'align-items:flex-start;text-align:left;padding-left:'+u*10+'px':''}">
    <div class="kicker a" data-a="up" data-t=".2" style="font-size:${u*s(3,2.6,2.4)}px;margin-bottom:${u*3}px">Para marcas e estabelecimentos</div>
    <div class="big" style="font-size:${u*s(7.8,7.2,8.6)}px;max-width:${L?u*110:u*92}px">
      <span class="line a" data-a="up" data-t=".5">Como colocar</span>
      <span class="line a" data-a="up" data-t=".8">sua marca nas mãos</span>
      <span class="line a" data-a="up" data-t="1.1">da população,</span>
      <span class="line a accent" data-a="pop" data-t="1.7">24h por dia?</span>
    </div>
  </div></div>`;

// ---------- SCENE 2 (4.2–9): brand + Curitiba ----------
h += `<div class="scene" data-s="4.2" data-e="9" style="background:radial-gradient(ellipse at 50% 35%,#0E4A7A 0%,#06223D 70%)">
  <div id="batt2" class="abs a" data-a="batt" data-t="4.4" data-d="3.8" style="opacity:0;${V?`left:${(W-u*16.2)/2}px;top:${u*8}px;width:${u*16.2}px`:(L?`right:${u*8}px;top:${u*8}px;width:${u*14.75}px`:`right:${u*7}px;top:${u*7}px;width:${u*12.8}px`)}">${battSVG(0,'',true)}</div>
  <div class="wv a" data-a="fade" data-t="4.3" style="left:-10%;width:120%;top:${s(58,55,52)}%;height:${s(26,32,40)}%">${waves(34,1600,400,80,0)}</div>
  <div class="center">
    <div class="a" data-a="draw" data-t="4.4" data-d="2.2" style="width:${u*s(34,26,26)}px;opacity:.95">${CWB}</div>
    <img id="logo2" class="a" data-a="pop" data-t="5.6" src="img/brezze_logo.png" style="width:${u*s(70,54,52)}px;margin-top:${u*4}px">
    <div class="a" data-a="up" data-t="6.4" style="margin-top:${u*4}px"><span class="pill" style="font-size:${u*s(3.4,2.8,2.6)}px">${ICON.pin} Chega a Curitiba</span></div>
    <div class="a" data-a="up" data-t="7.1" id="tag2" style="margin-top:${u*3}px;font-weight:800;font-style:italic;font-size:${u*s(4.6,3.8,3.6)}px">Leve a energia com você!</div>
  </div></div>`;

// ---------- SCENE 3 (8.8–14): proof numbers ----------
h += `<div class="scene" data-s="8.8" data-e="14">
  <img class="bgimg kb" src="img/ph_mural_curitiba.jpg" style="object-position:${s('50% 20%','50% 25%','50% 22%')}">
  <div class="shade" style="background:${L?'linear-gradient(90deg,#06223D 30%,rgba(6,34,61,.55) 60%,rgba(6,34,61,.15))':'linear-gradient(180deg,rgba(6,34,61,.2) 10%,rgba(6,34,61,.88) 48%,#06223D 75%)'}"></div>
  <div class="abs" style="${L?`left:${u*10}px;top:${u*14}px;width:${u*80}px`:`left:${u*8}px;right:${u*8}px;bottom:${u*s(16,8,0)}px`}">
    <div class="kicker a" data-a="up" data-t="9.1" style="font-size:${u*s(3,2.4,2.4)}px;margin-bottom:${u*3}px">Operação comprovada</div>
    <div style="display:flex;gap:${u*6}px;${V?'flex-direction:column;gap:'+u*4+'px':''}">
      <div class="statbig a" data-a="up" data-t="9.4"><b style="font-size:${u*s(15,10,11)}px">+<span class="count" data-to="50000" data-t="9.4" data-d="1.6">0</span></b><span style="font-size:${u*s(3.8,3,2.8)}px">locações realizadas</span></div>
      <div class="statbig a" data-a="up" data-t="10.2"><b class="accent" style="font-size:${u*s(15,10,11)}px">+<span class="count" data-to="19000" data-t="10.2" data-d="1.6">0</span></b><span style="font-size:${u*s(3.8,3,2.8)}px">usuários cadastrados</span></div>
    </div>
    <div class="a" data-a="up" data-t="11.6" style="margin-top:${u*4}px;font-weight:600;font-size:${u*s(3.4,2.7,2.5)}px;line-height:1.4;opacity:.95">
      No Aeroporto de <b>Viracopos</b> e Metrô de <b>São Paulo</b> para o <b>Jardim Botânico</b>, <b>Rua 24 Horas</b>, <b>Ópera de Arame</b>...</div>
  </div></div>`;


// ---------- STEPS: Como funciona (absolute 15.0–18.95; inserted between scenes 3 and 4) ----------
const STEPS = ["Baixe o app", "Cadastre-se", "Retire o powerbank", "Leve a energia com você", "Devolva em até 24 horas"], SICON = ['<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 7v7M9 11l3 3 3-3"/><path d="M10 19h4"/>','<circle cx="10" cy="8" r="4"/><path d="M3 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/><path d="M19 7v6M16 10h6"/>','<rect x="4" y="9" width="12" height="13" rx="2"/><path d="M8 13h4"/><path d="M18 2v8M15 5l3-3 3 3"/>','<path d="M13 2 5 13h6l-1 9 9-12h-6z"/>','<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3v5h-5"/><text x="12" y="15" font-size="7" font-weight="800" text-anchor="middle" fill="#C6FF2E" stroke="none" font-family="Montserrat">24h</text>'];
h += `<div class="scene" data-abs="1" data-s="15.0" data-e="18.95" style="background:radial-gradient(ellipse at 50% 35%,#0E4A7A 0%,#06223D 72%)">
  <div class="wv" style="left:-10%;width:120%;top:70%;height:26%">${waves(30,1600,400,70,2.2)}</div>
  <div class="center" style="padding:0 ${u*7}px">
    <div class="kicker a" data-a="up" data-t="15.15" style="font-size:${u*s(3.2,2.6,2.4)}px;color:var(--lime)">Como funciona</div>
    <div class="big a" data-a="up" data-t="15.3" style="font-size:${u*s(7.6,6,5.6)}px;margin:${u*1.4}px 0 ${u*s(6,4,6)}px">É simples:</div>
    <div style="display:flex;${L?'gap:'+u*3+'px;justify-content:center':'flex-direction:column;gap:'+u*s(3.4,2,0)+'px;align-items:flex-start'}">
      ${STEPS.map((txt, i) => `<div class="a" data-a="${L?'up':'left'}" data-t="${(15.55 + i * .42).toFixed(2)}" style="display:flex;${L?'flex-direction:column;align-items:center;text-align:center;width:'+u*27+'px':'align-items:center;gap:'+u*s(3.4,2.6,0)+'px'}">
        <div style="position:relative;flex:none;width:${u*s(14,9.5,13)}px;height:${u*s(14,9.5,13)}px;border-radius:50%;border:${u*.4}px solid var(--lime);display:flex;align-items:center;justify-content:center;box-shadow:0 0 ${u*2}px rgba(198,255,46,.35)">
          <svg viewBox="0 0 24 24" fill="none" stroke="#C6FF2E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:56%">${SICON[i]}</svg>
          <div style="position:absolute;top:-${u*.8}px;left:-${u*.8}px;width:${u*s(4.6,3.4,4)}px;height:${u*s(4.6,3.4,4)}px;border-radius:50%;background:var(--lime);color:#06223D;font-weight:900;font-size:${u*s(2.6,2,2.2)}px;display:flex;align-items:center;justify-content:center">${i+1}</div></div>
        <div style="font-weight:800;font-size:${u*s(4.6,3.5,3)}px;line-height:1.15;${L?'margin-top:'+u*2.2+'px':''}">${txt}</div></div>`).join('')}
    </div></div></div>`;

// ---------- SCENE 4 (13.8–19.6): QR code strategy ----------
h += `<div class="scene" data-s="13.8" data-e="19.6">
  <img class="bgimg kb" src="img/ph_kiosk_hands.jpg" style="object-position:50% 50%">
  <div class="shade" style="background:rgba(6,34,61,.86)"></div>
  <div class="abs" style="${L?`left:${u*10}px;top:${u*16}px;width:${u*90}px`:`left:${u*8}px;right:${u*8}px;top:${u*s(22,9,0)}px`}">
    <div class="big" style="font-size:${u*s(7.6,6.4,6.6)}px">
      <span class="line a" data-a="up" data-t="14.1">Como atrair mais</span>
      <span class="line a" data-a="up" data-t="14.35">clientes para o seu</span>
      <span class="line a" data-a="up" data-t="14.6">estabelecimento?</span></div>
    <div class="kicker a" data-a="up" data-t="15.6" style="font-size:${u*s(3.6,3,2.8)}px;margin-top:${u*5}px">QR Code Estratégico</div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:${u*2}px;margin-top:${u*2.6}px;font-size:${u*s(3.6,2.9,2.7)}px">
      <span class="chip a" data-a="left" data-t="16.1"><i></i>Sua mensagem</span>
      <span class="chip a" data-a="left" data-t="16.5"><i></i>Seu lead form</span>
      <span class="chip a" data-a="left" data-t="16.9"><i></i>Sua experiência ao cliente</span></div>
  </div>
  <div class="abs a" data-a="pop" data-t="15.2" style="${L?`right:${u*12}px;top:${u*22}px`:(V?`left:50%;margin-left:-${u*22}px;bottom:${u*12}px`:`right:${u*7}px;bottom:${u*9}px`)}">
    <div style="position:relative;width:${u*s(44,30,44)}px">
      <img src="img/phone_battery.png" style="width:100%;filter:drop-shadow(0 ${u}px ${u*4}px rgba(0,0,0,.5))">
    </div></div>
</div>`;

// ---------- SCENE 5 (19.4–23.4): partners ----------
const cols = s(2, 4, 6);
h += `<div class="scene" data-s="19.4" data-e="23.4" style="background:radial-gradient(ellipse at 50% 40%,#0E4A7A 0%,#06223D 72%)">
  <div class="wv" style="left:-10%;width:120%;top:62%;height:30%">${waves(30,1600,400,70,1.6)}</div>
  <div class="center" style="padding:0 ${u*7}px">
    <div class="kicker a" data-a="up" data-t="19.6" style="font-size:${u*s(3.2,2.6,2.4)}px">Marcas que também se conectaram</div>
    <div class="big a" data-a="up" data-t="19.8" style="font-size:${u*s(7,6,5.6)}px;margin:${u*2}px 0 ${u*6}px">ao público com a BreZZe</div>
    <div class="logogrid" style="row-gap:${u*s(6,5,5)}px;width:100%">
      ${LOGOS.map((l, i) => `<div class="slot" style="width:${100/cols}%">${logoItem(l, u * s(7.4, 5, 5.2), 'a', `data-a="pop" data-t="${(20.2 + i * .14).toFixed(2)}"`)}</div>`).join('')}
    </div></div></div>`;

// ---------- SCENE 6 (23.2–28): CTA ----------
h += `<div class="scene" data-s="23.2" data-e="28.5">
  <img class="bgimg kb" src="img/ph_woman_battery.jpg" style="object-position:${s('30% 50%','35% 50%','30% 40%')}">
  <div class="shade" style="background:${L?'linear-gradient(270deg,#06223D 38%,rgba(6,34,61,.6) 65%,rgba(6,34,61,.25))':'linear-gradient(180deg,rgba(6,34,61,.35),rgba(6,34,61,.9) 45%,#06223D 70%)'}"></div>
  <div class="abs" style="${L?`right:${u*9}px;top:${u*8}px;width:${u*80}px`:`left:${u*8}px;right:${u*8}px;bottom:${u*s(37,31,0)}px`}">
    <img class="a" data-a="up" data-t="23.5" src="img/brezze_logo.png" style="height:${u*s(8,6.5,7)}px">
    <div class="kicker a" data-a="pop" data-t="23.8" style="color:var(--lime);font-size:${u*s(3.6,3,2.8)}px;margin-top:${u*4}px">Oportunidade!</div>
    <div class="big" style="font-size:${u*s(9,7.4,7.4)}px;margin-top:${u*1.4}px">
      <span class="line a" data-a="up" data-t="24.05">Invista no</span>
      <span class="line a accent" data-a="up" data-t="24.3">OOH Smart.</span></div>
    <div class="a" data-a="up" data-t="24.8" style="font-weight:600;font-size:${u*s(4,3.2,3)}px;margin-top:${u*2.4}px;line-height:1.35">Invista no <b class="cy">TeamWork BreZZe Brasil</b><br>e leve sua marca a toda a Grande Curitiba.</div>
    <div class="a" data-a="up" data-t="26.1" style="font-weight:800;font-style:italic;margin-top:${u*3}px;font-size:${u*s(3.8,3,2.8)}px">Leve a energia com você!</div>
    </div>
  ${qrCorners(u*s(15.5,12.5,12), u*s(6,5,5), u*s(5,5,5), 'a', 'data-a="pop" data-t="25.3"', 'data-a="pop" data-t="25.6"')}
  </div>`;

h += `<div class="bar" id="bar"></div>`;
stage.innerHTML = h;
// shift the original timeline after the hook, compress it by K, and open a D-second gap before scene 4 for "Como funciona"
stage.querySelectorAll('.scene').forEach(sc => {
  if (sc.id === 'hook' || sc.dataset.abs) return;
  const shift = +sc.dataset.s >= 13.5 ? D : 0, map = v => (OFF + v * K + shift).toFixed(3);
  [sc, ...sc.querySelectorAll('[data-t],[data-s],[data-e],[data-d]')].forEach(el => {
    for (const k of ['t', 's', 'e']) if (el.dataset[k] !== undefined) el.dataset[k] = map(+el.dataset[k]);
    if (el.dataset.d !== undefined) el.dataset.d = (+el.dataset.d * K).toFixed(3);
  });
});
// hook renderer: 3 vignettes (pay / photo / call), alerts, red pulse, shake, power-off
const HK = { ph: [...document.querySelectorAll('#hook .hph')], cap: [...document.querySelectorAll('#hook .hcap')], not: [...document.querySelectorAll('#hook .hnot')],
  photos: document.getElementById('hphotos'), red: document.getElementById('hred'), flash: document.getElementById('hflash'), line: document.getElementById('hline'), end: document.getElementById('hend') };
const HSEG = [0, 1.3, 2.6, 3.55], HALERT = [0.75, 2.05, 2.95];
function hookRender(t) {
  if (t > 4.4) return;
  const seg = t < HSEG[1] ? 0 : t < HSEG[2] ? 1 : t < HSEG[3] ? 2 : 3;
  let amp = .25;
  HALERT.forEach(a => { if (t > a && t < a + .4) amp += 1.4 * (1 - (t - a) / .4); });
  const dx = (Math.sin(t * 91) + Math.sin(t * 57)) * amp * u * .45, dy = (Math.cos(t * 83) + Math.sin(t * 41)) * amp * u * .45;
  HK.ph.forEach((el, i) => { const on = i === seg; el.style.opacity = on ? 1 : 0;
    if (on) { const p = (t - HSEG[i]) / (HSEG[i + 1] - HSEG[i]); el.style.transform = `translate(${dx}px,${dy}px) scale(${1.03 + .1 * p})`; el.style.filter = `saturate(${1 - .3 * p}) contrast(1.08)`; } });
  HK.cap.forEach((el, i) => { const q = seg === i ? Math.min(1, (t - HSEG[i]) / .2) : 0; el.style.opacity = q; el.style.transform = `translateY(${(1 - q) * u * 3}px)`; });
  HK.not.forEach((el, i) => { const p = Math.max(0, Math.min(1, (t - HALERT[i]) / .3)), k = 1 + 1.7 * Math.pow(p - 1, 3) + .7 * Math.pow(p - 1, 2);
    const vis = seg === i && t >= HALERT[i]; el.style.transform = `translateY(${vis ? (-160 + 160 * k) : -160}%)`; });
  const pulse = .3 + .7 * Math.max(0, Math.sin(t * Math.PI * 2 * 2.2));
  HK.red.style.opacity = (seg === 3 ? .95 : .6) * pulse;
  HK.flash.style.opacity = HALERT.some(a => t > a && t < a + .12) ? .55 : 0;
  const po = Math.max(0, Math.min(1, (t - 3.36) / .17));
  HK.photos.style.transform = seg < 3 ? `scaleY(${1 - .995 * po})` : 'scaleY(0)';
  HK.line.style.opacity = (t > 3.42 && t < 3.6) ? 1 : 0;
  HK.end.style.opacity = seg === 3 ? 1 : 0;
  HK.end.querySelector('svg').style.opacity = Math.sin(t * Math.PI * 2 * 3) > 0 ? 1 : .2;
}

// fit the scene-2 battery around logo + pill + tagline (measured before any transform)
const fitBatt = () => { const L2 = document.getElementById('logo2'), T2 = document.getElementById('tag2'), keep = [L2.style.transform, T2.style.transform]; L2.style.transform = T2.style.transform = 'none';
  const sr = stage.getBoundingClientRect(), l = L2.getBoundingClientRect(), g = T2.getBoundingClientRect(); L2.style.transform = keep[0]; T2.style.transform = keep[1];
  const top = l.top - sr.top - u * 5, bot = g.bottom - sr.top + u * 4, h = bot - top, w = h * 122 / 60;
  const b = document.getElementById('batt2'); Object.assign(b.style, { left: (W - w * 0.93) / 2 + 'px', top: top + 'px', width: w + 'px' }); };
// measure CWB path lengths
document.querySelectorAll('.cwb path,.cwb circle').forEach(p => { const l = p.getTotalLength ? p.getTotalLength() : 300; p.style.setProperty('--len', l); });

// ---------- timeline renderer ----------
const clamp = x => Math.max(0, Math.min(1, x));
const eo = x => 1 - Math.pow(1 - x, 3);
const eback = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const scenes = [...document.querySelectorAll('.scene')];
const anims = [...document.querySelectorAll('.a')];
const counts = [...document.querySelectorAll('.count')];
const fmt = n => n.toLocaleString('pt-BR');
window.render = t => {
  hookRender(t);
  scenes.forEach(sc => {
    const a = +sc.dataset.s, e = +sc.dataset.e, X = .45;
    const o = clamp((t - a) / X) * clamp((e - t) / X);
    sc.style.opacity = (a === 0 && t < X) ? 1 : o;
    sc.style.visibility = o > 0 || (a === 0 && t < X) ? 'visible' : 'hidden';
    const bg = sc.querySelector('.kb');
    if (bg) { const p = clamp((t - a) / (e - a)); bg.style.transform = `scale(${1.12 - .1 * p}) translateY(${(1 - p) * u}px)`; }
  });
  anims.forEach(el => {
    const t0 = +el.dataset.t, d = +(el.dataset.d || .6), p = clamp((t - t0) / d), k = eo(p);
    switch (el.dataset.a) {
      case 'up': el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * u * 4}px)`; break;
      case 'left': el.style.opacity = k; el.style.transform = `translateX(${(1 - k) * -u * 8}px)`; break;
      case 'fade': el.style.opacity = k; break;
      case 'batt': { el.style.opacity = .5 * clamp((t - t0) / .4); const f = el.querySelector('.fill'), fh = 94 * eo(p); f.setAttribute('y', (114 - fh).toFixed(1)); f.setAttribute('height', fh.toFixed(1)); break; }
      case 'pop': el.style.opacity = clamp(p * 2); el.style.transform = `scale(${.6 + .4 * eback(p)})`; break;
      case 'draw': el.querySelectorAll('path,circle').forEach((pth, i, all) => {
          const l = +pth.style.getPropertyValue('--len'); const q = eo(clamp(p * 1.4 - i / all.length * .4));
          pth.style.strokeDashoffset = l * (1 - q); }); break;
    }
  });
  counts.forEach(c => { const p = eo(clamp((t - +c.dataset.t) / +c.dataset.d)); c.textContent = fmt(Math.round(+c.dataset.to * p / 100) * 100); });
  document.getElementById('bar').style.width = (t / T * 100) + '%';
};
window.T = T;
window.READY = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))]).then(() => render(window.__t || 0));
