<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>BreZZe Curitiba — Vídeo</title>
<link rel="stylesheet" href="common.css">
<style>
.hscr{position:absolute;inset:0;opacity:0}
.nodash path,.nodash circle{stroke-dasharray:none!important;stroke-dashoffset:0!important;stroke:#d9f6ff}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0}
.scene .bgimg{position:absolute;inset:-2%;width:104%;height:104%;object-fit:cover;transform-origin:50% 40%}
.shade{position:absolute;inset:0}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.a{will-change:transform,opacity}
.big{font-weight:900;line-height:1.03;letter-spacing:-.025em}
.kicker{font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.line{display:block;white-space:nowrap}
.wv{position:absolute;opacity:.6}
.wv svg{width:100%;height:100%}
.cwb path,.cwb circle{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.chip{display:inline-flex;align-items:center;gap:.6em;background:rgba(255,255,255,.1);border:1px solid rgba(60,203,244,.55);
  border-radius:999px;padding:.55em 1.1em;font-weight:700;backdrop-filter:blur(6px)}
.chip i{width:.55em;height:.55em;border-radius:50%;background:var(--cyan);display:inline-block}
.statbig b{display:block;font-weight:900;line-height:1;letter-spacing:-.03em}
.statbig b span{display:inline!important;margin:0!important;opacity:1!important}
.statbig > span{display:block;font-weight:600;opacity:.9;margin-top:.3em}
.bar{position:absolute;left:0;bottom:0;height:calc(var(--u)*.8);background:linear-gradient(90deg,#3CCBF4,#C6FF2E);box-shadow:0 0 calc(var(--u)*1.5) rgba(198,255,46,.6)}
.logogrid{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
.logogrid .slot{display:flex;justify-content:center;align-items:center}
.logogrid img{filter:brightness(0) invert(1);object-fit:contain}
.logogrid .wm{font-weight:900;letter-spacing:-.02em;line-height:1}
.scan{position:absolute;left:6%;right:6%;height:3px;background:var(--cyan);box-shadow:0 0 18px 4px rgba(60,203,244,.8)}
</style></head><body>
<div id="stage"></div>
<script src="shared.js"></script>
<script>
const u = Math.min(W, H) / 100;
const V = F === '9x16', L = F === '16x9';
const s = (a, b, c) => V ? a : (L ? c : b);           // pick by format: (vertical, square, landscape)
const T = 30;                                          // duration (s)
const OFF = 4.0, K = 26 / 28;                          // hook lasts OFF s; the original 28 s timeline is compressed by K after it
let h = '';


// ---------- HOOK (0–4.25): 2% battery stress ----------
const PW = u * s(54, 34, 36), PH = PW * 2.05;
const phoneXY = L ? [W * 0.6, (H - PH) / 2] : (V ? [(W - PW) / 2, u * 46] : [(W - PW) / 2, u * 25]);
const capBox = L ? `left:${u*10}px;top:0;bottom:0;width:${u*88}px;display:flex;flex-direction:column;justify-content:center`
                 : `left:${u*6}px;right:${u*6}px;top:${u*s(16,5,0)}px;height:${u*s(26,18,0)}px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center`;
const statusBar = (dark, pct) => `<div style="display:flex;justify-content:space-between;align-items:center;height:calc(var(--p)*10);padding:0 calc(var(--p)*7);font-weight:700;font-size:calc(var(--p)*4.6);color:${dark?'#fff':'#111'}">
  <span>18:42</span><span class="hpct" style="display:flex;align-items:center;gap:calc(var(--p)*1.4);color:#FF3B30">${pct}
  <svg viewBox="0 0 26 12" style="width:calc(var(--p)*7)"><rect x="1" y="1" width="21" height="10" rx="2.5" fill="none" stroke="${dark?'#fff':'#111'}" stroke-width="1.4"/><rect x="23" y="4" width="2" height="4" rx="1" fill="${dark?'#fff':'#111'}"/><rect x="2.6" y="2.6" width="1.6" height="6.8" rx=".8" fill="#FF3B30"/></svg></span></div>`;
const alertCard = (title, msg) => `<div class="halert" style="position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0">
  <div class="hcard" style="width:calc(var(--p)*80);background:#fff;border-radius:calc(var(--p)*5);padding:calc(var(--p)*5.5) calc(var(--p)*5);text-align:center;color:#111;box-shadow:0 calc(var(--p)*3) calc(var(--p)*10) rgba(0,0,0,.5)">
    <svg viewBox="0 0 26 12" style="width:calc(var(--p)*16)"><rect x="1" y="1" width="21" height="10" rx="2.5" fill="none" stroke="#FF3B30" stroke-width="1.6"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#FF3B30"/><rect x="2.6" y="2.6" width="1.6" height="6.8" rx=".8" fill="#FF3B30"/></svg>
    <div style="font-weight:800;font-size:calc(var(--p)*6);margin-top:calc(var(--p)*2.4)">${title}</div>
    <div style="font-weight:600;font-size:calc(var(--p)*4.4);margin-top:calc(var(--p)*1.6);color:#FF3B30;line-height:1.3">${msg}</div></div></div>`;
const scr1 = `<div class="hscr" style="background:#F2F4F7">${statusBar(false,'2%')}
  <div style="text-align:center;margin-top:calc(var(--p)*8);font-weight:800;font-size:calc(var(--p)*6.4);color:#111">Pagamento</div>
  <div style="margin:calc(var(--p)*8) calc(var(--p)*8) 0;background:#fff;border-radius:calc(var(--p)*5);padding:calc(var(--p)*7) 0;text-align:center;box-shadow:0 calc(var(--p)*1) calc(var(--p)*4) rgba(0,0,0,.08)">
    <div style="font-weight:600;font-size:calc(var(--p)*4.4);color:#667">Total</div>
    <div style="font-weight:900;font-size:calc(var(--p)*12);color:#111;letter-spacing:-.02em">R$ 87,90</div></div>
  <svg viewBox="0 0 60 60" style="display:block;margin:calc(var(--p)*12) auto 0;width:calc(var(--p)*30)" fill="none" stroke="#1E7FCB" stroke-width="3.2" stroke-linecap="round">
    <path d="M22 18 Q30 30 22 42"/><path d="M30 12 Q42 30 30 48"/><path d="M38 6 Q54 30 38 54"/></svg>
  <div style="text-align:center;font-weight:700;font-size:calc(var(--p)*4.8);color:#334;margin-top:calc(var(--p)*5)">Aproxime do leitor</div>
  ${alertCard('Bateria fraca', '2% restante')}</div>`;
const scr2 = `<div class="hscr" style="background:#0d0d0d">${statusBar(true,'1%')}
  <div style="position:absolute;left:0;right:0;top:calc(var(--p)*16);bottom:calc(var(--p)*42);background:radial-gradient(circle at 50% 45%,#1d3b2a,#0a1410)">
    <div style="position:absolute;inset:0;background:linear-gradient(#fff3,#fff3) 33.3% 0/1px 100% no-repeat,linear-gradient(#fff3,#fff3) 66.6% 0/1px 100% no-repeat,linear-gradient(#fff3,#fff3) 0 33.3%/100% 1px no-repeat,linear-gradient(#fff3,#fff3) 0 66.6%/100% 1px no-repeat"></div>
    <div style="position:absolute;left:50%;top:50%;width:calc(var(--p)*56);transform:translate(-50%,-50%)" class="nodash">${CWB}</div>
    <div style="position:absolute;left:calc(var(--p)*5);top:calc(var(--p)*5);display:flex;align-items:center;gap:calc(var(--p)*1.6);background:rgba(0,0,0,.45);border-radius:999px;padding:calc(var(--p)*1.6) calc(var(--p)*3.4);font-weight:700;font-size:calc(var(--p)*4);color:#fff">${ICON.pin.replace('<svg','<svg style="width:calc(var(--p)*4.4)"')}Jardim Botânico</div></div>
  <div style="position:absolute;left:0;right:0;bottom:calc(var(--p)*10);display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*4)">
    <div style="font-weight:800;font-size:calc(var(--p)*4);letter-spacing:.14em;color:#FFD60A">FOTO</div>
    <div style="width:calc(var(--p)*19);height:calc(var(--p)*19);border-radius:50%;border:calc(var(--p)*1.6) solid #fff;box-shadow:inset 0 0 0 calc(var(--p)*1.4) #0d0d0d;background:#fff"></div></div>
  ${alertCard('Bateria fraca', '1% · câmera desativada')}</div>`;
const scr3 = `<div class="hscr" style="background:linear-gradient(180deg,#24344a,#0b1320)">${statusBar(true,'1%')}
  <div style="text-align:center;margin-top:calc(var(--p)*14)">
    <div style="width:calc(var(--p)*36);height:calc(var(--p)*36);border-radius:50%;margin:0 auto;background:linear-gradient(135deg,#3CCBF4,#2453C7);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--p)*15);color:#fff">M</div>
    <div style="font-weight:800;font-size:calc(var(--p)*6);color:#fff;margin-top:calc(var(--p)*5)">Mãe</div>
    <div style="font-weight:600;font-size:calc(var(--p)*4.2);color:#cfe3f5;margin-top:calc(var(--p)*1.4)">Chamada de vídeo · 12:47</div></div>
  <div style="position:absolute;right:calc(var(--p)*5);top:calc(var(--p)*13);width:calc(var(--p)*22);height:calc(var(--p)*32);border-radius:calc(var(--p)*3.4);background:linear-gradient(160deg,#55657a,#2a3646);border:1px solid #fff4"></div>
  <div style="position:absolute;left:0;right:0;bottom:calc(var(--p)*12);display:flex;justify-content:center;gap:calc(var(--p)*8)">
    <div style="width:calc(var(--p)*15);height:calc(var(--p)*15);border-radius:50%;background:#ffffff26"></div>
    <div style="width:calc(var(--p)*15);height:calc(var(--p)*15);border-radius:50%;background:#FF3B30;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" style="width:60%"><path d="M3 14c5-5 13-5 18 0l-2.5 2.5-3-1.6v-2.6c-2.2-.8-4.8-.8-7 0v2.6l-3 1.6z" fill="#fff"/></svg></div>
    <div style="width:calc(var(--p)*15);height:calc(var(--p)*15);border-radius:50%;background:#ffffff26"></div></div>
  ${alertCard('Bateria em 1%', 'A chamada será encerrada')}</div>`;
const cap = (txt, i) => `<div class="hcap" data-i="${i}" style="position:absolute;inset:0;${capBox};opacity:0">
   <div style="font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#FF3B30;font-size:${u*s(3,2.4,2.4)}px">Alerta de bateria</div>
   <div class="big" style="font-size:${u*s(8,6.6,6.4)}px;margin-top:${u*1.6}px">${txt}</div></div>`;
h += `<div class="scene" id="hook" data-s="0" data-e="4.25" style="background:#120608">
  <img class="hbg" src="img/ph_woman_airport.jpg" style="position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(${u*.7}px) saturate(.5) brightness(.55);opacity:0">
  <img class="hbg" src="img/ph_mural_curitiba.jpg" style="position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(${u*.7}px) saturate(.5) brightness(.55);opacity:0">
  <img class="hbg" src="img/ph_man_paulista.jpg" style="position:absolute;inset:-4%;width:108%;height:108%;object-fit:cover;filter:blur(${u*.7}px) saturate(.5) brightness(.55);opacity:0">
  <div id="hred" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,30,30,.05) 30%,rgba(255,20,20,.75) 100%);mix-blend-mode:screen"></div>
  <div class="abs" id="hcaps" style="inset:0">
    ${cap('Na hora de pagar…', 0)}${cap('Na foto do Botânico…', 1)}${cap('No meio da chamada…', 2)}${cap('E agora?!', 3)}</div>
  <div id="phone" style="position:absolute;left:${phoneXY[0]}px;top:${phoneXY[1]}px;width:${PW}px;height:${PH}px;--p:${PW/100}px;border-radius:calc(var(--p)*14);background:#0a0a0a;box-shadow:0 0 0 calc(var(--p)*1.4) #2a2a2a,0 calc(var(--p)*6) calc(var(--p)*18) rgba(0,0,0,.7)">
    <div id="hscreen" style="position:absolute;inset:calc(var(--p)*3);border-radius:calc(var(--p)*11);overflow:hidden;background:#000">
      ${scr1}${scr2}${scr3}
      <div id="hoff" style="position:absolute;inset:0;background:#000;opacity:0;display:flex;align-items:center;justify-content:center">
        <svg viewBox="0 0 60 122" style="width:calc(var(--p)*26)" fill="none"><rect x="19" y="2" width="22" height="9" rx="3.5" fill="#FF3B30"/><rect x="2" y="14" width="56" height="106" rx="11" stroke="#FF3B30" stroke-width="4"/><rect x="8" y="108" width="44" height="6" rx="3" fill="#FF3B30"/></svg></div>
      <div id="hline" style="position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#fff;box-shadow:0 0 12px 4px #fff;opacity:0"></div>
    </div></div>
</div>`;

// ---------- SCENE 1 (0–4.4): hook question ----------
h += `<div class="scene" data-s="0" data-e="4.4">
  <img class="bgimg kb" src="img/ph_linha_turismo.jpg" style="object-position:${s('42% 50%','45% 50%','50% 50%')}">
  <div class="shade" style="background:linear-gradient(${s('180deg','180deg','90deg')},rgba(6,34,61,.55),rgba(6,34,61,.92))"></div>
  <div class="center" style="padding:0 ${u*8}px;${L?'align-items:flex-start;text-align:left;padding-left:'+u*10+'px':''}">
    <div class="kicker a" data-a="up" data-t=".2" style="font-size:${u*s(3,2.6,2.4)}px;margin-bottom:${u*3}px">Para marcas e estabelecimentos</div>
    <div class="big" style="font-size:${u*s(7.8,7.2,8.6)}px;max-width:${L?u*110:u*92}px">
      <span class="line a" data-a="up" data-t=".5">Como colocar</span>
      <span class="line a" data-a="up" data-t=".8">sua marca nas mãos</span>
      <span class="line a" data-a="up" data-t="1.1">da população,</span>
      <span class="line a accent" data-a="pop" data-t="1.7">24h por dia?</span>
    </div>
  </div></div>`;

// ---------- SCENE 2 (4.2–9): brand + Curitiba ----------
h += `<div class="scene" data-s="4.2" data-e="9" style="background:radial-gradient(ellipse at 50% 35%,#0E4A7A 0%,#06223D 70%)">
  <div id="batt2" class="abs a" data-a="batt" data-t="4.4" data-d="3.8" style="opacity:0;${V?`left:${(W-u*16.2)/2}px;top:${u*8}px;width:${u*16.2}px`:(L?`right:${u*8}px;top:${u*8}px;width:${u*14.75}px`:`right:${u*7}px;top:${u*7}px;width:${u*12.8}px`)}">${battSVG(0,'',true)}</div>
  <div class="wv a" data-a="fade" data-t="4.3" style="left:-10%;width:120%;top:${s(58,55,52)}%;height:${s(26,32,40)}%">${waves(34,1600,400,80,0)}</div>
  <div class="center">
    <div class="a" data-a="draw" data-t="4.4" data-d="2.2" style="width:${u*s(34,26,26)}px;opacity:.95">${CWB}</div>
    <img id="logo2" class="a" data-a="pop" data-t="5.6" src="img/brezze_logo.png" style="width:${u*s(70,54,52)}px;margin-top:${u*4}px">
    <div class="a" data-a="up" data-t="6.4" style="margin-top:${u*4}px"><span class="pill" style="font-size:${u*s(3.4,2.8,2.6)}px">${ICON.pin} Chega a Curitiba</span></div>
    <div class="a" data-a="up" data-t="7.1" id="tag2" style="margin-top:${u*3}px;font-weight:800;font-style:italic;font-size:${u*s(4.6,3.8,3.6)}px">Leve a energia com você!</div>
  </div></div>`;

// ---------- SCENE 3 (8.8–14): proof numbers ----------
h += `<div class="scene" data-s="8.8" data-e="14">
  <img class="bgimg kb" src="img/ph_mural_curitiba.jpg" style="object-position:${s('50% 20%','50% 25%','50% 22%')}">
  <div class="shade" style="background:${L?'linear-gradient(90deg,#06223D 30%,rgba(6,34,61,.55) 60%,rgba(6,34,61,.15))':'linear-gradient(180deg,rgba(6,34,61,.2) 10%,rgba(6,34,61,.88) 48%,#06223D 75%)'}"></div>
  <div class="abs" style="${L?`left:${u*10}px;top:${u*14}px;width:${u*80}px`:`left:${u*8}px;right:${u*8}px;bottom:${u*s(16,8,0)}px`}">
    <div class="kicker a" data-a="up" data-t="9.1" style="font-size:${u*s(3,2.4,2.4)}px;margin-bottom:${u*3}px">Operação comprovada</div>
    <div style="display:flex;gap:${u*6}px;${V?'flex-direction:column;gap:'+u*4+'px':''}">
      <div class="statbig a" data-a="up" data-t="9.4"><b style="font-size:${u*s(15,12,11)}px">+<span class="count" data-to="50000" data-t="9.4" data-d="1.6">0</span></b><span style="font-size:${u*s(3.8,3,2.8)}px">locações realizadas</span></div>
      <div class="statbig a" data-a="up" data-t="10.2"><b class="accent" style="font-size:${u*s(15,12,11)}px">+<span class="count" data-to="19000" data-t="10.2" data-d="1.6">0</span></b><span style="font-size:${u*s(3.8,3,2.8)}px">usuários cadastrados</span></div>
    </div>
    <div class="a" data-a="up" data-t="11.6" style="margin-top:${u*4}px;font-weight:600;font-size:${u*s(3.4,2.7,2.5)}px;line-height:1.4;opacity:.95">
      No Aeroporto de <b>Viracopos</b> e Metrô de <b>São Paulo</b> para o <b>Jardim Botânico</b>, <b>Rua 24 Horas</b>, <b>Ópera de Arame</b>...</div>
  </div></div>`;

// ---------- SCENE 4 (13.8–19.6): QR code strategy ----------
h += `<div class="scene" data-s="13.8" data-e="19.6">
  <img class="bgimg kb" src="img/ph_kiosk_hands.jpg" style="object-position:50% 50%">
  <div class="shade" style="background:rgba(6,34,61,.86)"></div>
  <div class="abs" style="${L?`left:${u*10}px;top:${u*16}px;width:${u*90}px`:`left:${u*8}px;right:${u*8}px;top:${u*s(22,9,0)}px`}">
    <div class="big" style="font-size:${u*s(7.6,6.4,6.6)}px">

    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:${u*2}px;margin-top:${u*2.6}px;font-size:${u*s(3.6,2.9,2.7)}px">

  </div>
  <div class="abs a" data-a="pop" data-t="15.2" style="${L?`right:${u*12}px;top:${u*22}px`:(V?`left:50%;margin-left:-${u*22}px;bottom:${u*12}px`:`right:${u*7}px;bottom:${u*9}px`)}">
    <div style="position:relative;width:${u*s(44,30,44)}px">
      <img src="img/phone_battery.png" style="width:100%;filter:drop-shadow(0 ${u}px ${u*4}px rgba(0,0,0,.5))">
    </div></div>
</div>`;

// ---------- SCENE 5 (19.4–23.4): partners ----------
const cols = s(2, 4, 6);
h += `<div class="scene" data-s="19.4" data-e="23.4" style="background:radial-gradient(ellipse at 50% 40%,#0E4A7A 0%,#06223D 72%)">
  <div class="wv" style="left:-10%;width:120%;top:62%;height:30%">${waves(30,1600,400,70,1.6)}</div>

    <div class="logogrid" style="row-gap:${u*s(6,5,5)}px;width:100%">
      ${LOGOS.map((l, i) => `<div class="slot" style="width:${100/cols}%">${logoItem(l, u * s(7.4, 5, 5.2), 'a', `data-a="pop" data-t="${(20.2 + i * .14).toFixed(2)}"`)}</div>`).join('')}
    </div></div></div>`;

// ---------- SCENE 6 (23.2–28): CTA ----------
h += `<div class="scene" data-s="23.2" data-e="28.5">
  <img class="bgimg kb" src="img/ph_woman_battery.jpg" style="object-position:${s('30% 50%','35% 50%','30% 40%')}">

const HSEG = [0, 1.3, 2.6, 3.55], HALERT = [0.7, 2.0, 2.95];
